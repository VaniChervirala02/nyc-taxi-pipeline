name: dbt CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install dbt-bigquery sqlfluff

      - name: Check dbt project structure
        run: |
          echo "=== Checking dbt project structure ==="
          
          # Check required files exist
          if [ -f "dbt_project.yml" ]; then
            echo "✅ dbt_project.yml found"
          else
            echo "❌ dbt_project.yml missing!"
            exit 1
          fi
          
          if [ -f "packages.yml" ]; then
            echo "✅ packages.yml found"
          else
            echo "⚠️ packages.yml not found"
          fi

      - name: Check models exist
        run: |
          echo "=== Checking dbt models ==="
          
          if [ -d "models" ]; then
            echo "✅ models/ directory found"
            echo "Models found:"
            find models/ -name "*.sql" | while read f; do
              echo "  → $f"
            done
          else
            echo "❌ models/ directory missing!"
            exit 1
          fi

      - name: Check tests exist
        run: |
          echo "=== Checking dbt tests ==="
          
          if [ -d "tests" ]; then
            echo "✅ tests/ directory found"
            echo "Tests found:"
            find tests/ -name "*.sql" | while read f; do
              echo "  → $f"
            done
          else
            echo "⚠️ tests/ directory not found"
          fi

      - name: Check schema files
        run: |
          echo "=== Checking schema files ==="
          
          schema_count=$(find models/ -name "schema.yml" | wc -l)
          echo "Schema files found: $schema_count"
          
          if [ "$schema_count" -gt 0 ]; then
            echo "✅ Schema files exist"
            find models/ -name "schema.yml" | while read f; do
              echo "  → $f"
            done
          else
            echo "⚠️ No schema.yml files found - tests may be missing!"
          fi

      - name: Validate SQL syntax
        run: |
          echo "=== Validating SQL files ==="
          sql_files=$(find models/ -name "*.sql" | wc -l)
          echo "SQL files to validate: $sql_files"
          
          find models/ -name "*.sql" | while read f; do
            if grep -q "SELECT\|select" "$f"; then
              echo "✅ $f - valid SQL structure"
            else
              echo "⚠️ $f - no SELECT found"
            fi
          done

      - name: Pipeline summary
        run: |
          echo "==============================="
          echo "dbt CI PIPELINE SUMMARY"
          echo "==============================="
          echo "Models: $(find models/ -name '*.sql' | wc -l)"
          echo "Tests:  $(find tests/ -name '*.sql' 2>/dev/null | wc -l)"
          echo "Schema: $(find models/ -name 'schema.yml' | wc -l)"
          echo "==============================="
          echo "✅ All checks passed!"
