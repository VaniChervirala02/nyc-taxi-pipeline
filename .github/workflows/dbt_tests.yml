name: dbt Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dbt
        run: |
          pip install dbt-bigquery
      
      - name: Validate dbt project structure
        run: |
          echo "✅ Checking dbt project structure..."
          ls -la
          echo "✅ DAGs folder exists: $(ls dags/)"
          echo "✅ Pipeline validation complete!"
