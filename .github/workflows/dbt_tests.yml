name: dbt CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install dbt-bigquery

      - name: Check Airflow project structure
        run: |
          echo "=== Checking Airflow project structure ==="
          
          if [ -d "dags" ]; then
            echo "✅ dags/ directory found"
            echo "DAGs found:"
            find dags/ -name "*.py" | while read f; do
              echo "  → $f"
            done
          else
            echo "❌ dags/ directory missing!"
            exit 1
          fi
          
          if [ -f "Dockerfile" ]; then
            echo "✅ Dockerfile found"
          else
            echo "❌ Dockerfile missing!"
            exit 1
          fi
          
          if [ -f "requirements.txt" ]; then
            echo "✅ requirements.txt found"
          else
            echo "⚠️ requirements.txt not found"
          fi

      - name: Validate DAG files
        run: |
          echo "=== Validating DAG Python files ==="
          find dags/ -name "*.py" | while read f; do
            python -c "import ast; ast.parse(open('$f').read())" && \
              echo "✅ $f - valid Python" || \
              echo "❌ $f - syntax error!"
          done

      - name: Check requirements
        run: |
          echo "=== Checking requirements.txt ==="
          cat requirements.txt
          echo "✅ Requirements file readable"

      - name: Pipeline summary
        run: |
          echo "==============================="
          echo "AIRFLOW CI PIPELINE SUMMARY"
          echo "==============================="
          echo "DAGs:         $(find dags/ -name '*.py' | wc -l)"
          echo "Requirements: $(cat requirements.txt | wc -l) packages"
          echo "==============================="
          echo "✅ All checks passed!"
